<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LinkShort - Encurtador de Links Professional</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <style>
    :root {
      --bg: #0f172a;
      --card-bg: rgba(30, 41, 59, 0.7);
      --primary: #38bdf8;
      --primary-hover: #0284c7;
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --border: rgba(255, 255, 255, 0.1);
      --success: #10b981;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }

    body {
      background: radial-gradient(circle at top left, #1e1b4b, #0f172a);
      color: var(--text);
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 20px;
    }

    .container {
      background: var(--card-bg);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid var(--border);
      padding: 32px 24px;
      border-radius: 20px;
      width: 100%;
      max-width: 420px;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.5);
      animation: fadeIn 0.5s ease-out;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .header { text-align: center; margin-bottom: 24px; }
    .badge { background: rgba(56, 189, 248, 0.1); color: var(--primary); font-size: 11px; padding: 4px 10px; border-radius: 20px; font-weight: 600; text-transform: uppercase; letter-spacing: 1px; }
    h1 { font-size: 24px; font-weight: 700; margin: 10px 0 6px; }
    p.desc { font-size: 13px; color: var(--text-muted); }

    .input-group { margin-bottom: 16px; text-align: left; }
    label { font-size: 12px; color: var(--text-muted); margin-bottom: 6px; display: block; font-weight: 500; }
    
    input {
      width: 100%;
      padding: 14px 16px;
      border-radius: 10px;
      border: 1px solid var(--border);
      background: rgba(15, 23, 42, 0.6);
      color: var(--text);
      font-size: 14px;
      outline: none;
      transition: all 0.2s;
    }

    input:focus { border-color: var(--primary); box-shadow: 0 0 0 3px rgba(56, 189, 248, 0.15); }

    button.btn-primary {
      width: 100%;
      padding: 14px;
      background: linear-gradient(135deg, #38bdf8, #0284c7);
      color: white;
      border: none;
      border-radius: 10px;
      font-weight: 600;
      font-size: 15px;
      cursor: pointer;
      transition: all 0.2s;
      box-shadow: 0 4px 12px rgba(2, 132, 199, 0.3);
    }

    button.btn-primary:active { transform: scale(0.98); }

    .result {
      margin-top: 24px;
      padding-top: 20px;
      border-top: 1px solid var(--border);
      display: none;
      animation: fadeIn 0.3s ease-out;
    }

    .copy-box { display: flex; gap: 8px; margin-top: 6px; }
    .copy-box input { margin-bottom: 0; font-weight: 600; color: var(--primary); }

    button.btn-copy {
      padding: 0 16px;
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid var(--border);
      color: var(--text);
      border-radius: 10px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
      white-space: nowrap;
    }

    button.btn-copy.copied { background: var(--success); color: white; border-color: var(--success); }

    .qr-container {
      margin-top: 20px;
      background: white;
      padding: 16px;
      border-radius: 12px;
      display: flex;
      justify-content: center;
      width: fit-content;
      margin-left: auto;
      margin-right: auto;
    }

    .history { margin-top: 24px; text-align: left; }
    .history h3 { font-size: 13px; color: var(--text-muted); margin-bottom: 10px; text-transform: uppercase; letter-spacing: 0.5px; }
    .history-item { display: flex; justify-content: space-between; align-items: center; background: rgba(15, 23, 42, 0.4); padding: 10px 12px; border-radius: 8px; margin-bottom: 8px; border: 1px solid var(--border); font-size: 13px; }
    .history-item a { color: var(--primary); text-decoration: none; font-weight: 500; text-overflow: ellipsis; overflow: hidden; white-space: nowrap; max-width: 200px; }
  </style>
</head>
<body>

  <div class="container">
    <div class="header">
      <span class="badge">Ferramenta Pro</span>
      <h1>LinkShort</h1>
      <p class="desc">Transforme links longos em URLs curtas e QR Codes instantaneos.</p>
    </div>

    <div class="input-group">
      <label for="url">Cole sua URL original</label>
      <input type="url" id="url" placeholder="https://exemplo.com/sua-pagina-longa" />
    </div>

    <button class="btn-primary" onclick="encurtar()">Encurtar Link</button>

    <div id="result" class="result">
      <div class="input-group">
        <label>Link curto gerado</label>
        <div class="copy-box">
          <input type="text" id="shortUrl" readonly />
          <button class="btn-copy" id="copyBtn" onclick="copiar()">Copiar</button>
        </div>
      </div>

      <div class="qr-container" id="qrcode"></div>
    </div>

    <div class="history" id="historySection" style="display: none;">
      <h3>Ultimos gerados</h3>
      <div id="historyList"></div>
    </div>
  </div>

  <script>
    document.addEventListener('DOMContentLoaded', carregarHistorico);

    async function encurtar() {
      const urlInput = document.getElementById('url');
      const url = urlInput.value.trim();
      const resultDiv = document.getElementById('result');
      const qrcodeDiv = document.getElementById('qrcode');
      const copyBtn = document.getElementById('copyBtn');

      if (!url) {
        alert('Por favor, digite ou cole uma URL valida!');
        return;
      }

      try {
        const res = await fetch(`https://tinyurl.com/api-create.php?url=${encodeURIComponent(url)}`);
        const shortUrl = await res.text();

        document.getElementById('shortUrl').value = shortUrl;
        resultDiv.style.display = 'block';

        // Reseta o botao de copiar
        copyBtn.innerText = 'Copiar';
        copyBtn.classList.remove('copied');

        // Gera QR Code
        qrcodeDiv.innerHTML = '';
        new QRCode(qrcodeDiv, { text: shortUrl, width: 120, height: 120 });

        // Salva no historico local
        salvarHistorico(shortUrl);

      } catch (err) {
        alert('Erro ao encurtar o link. Verifique sua conexao.');
      }
    }

    function copiar() {
      const copyText = document.getElementById('shortUrl');
      const copyBtn = document.getElementById('copyBtn');

      copyText.select();
      navigator.clipboard.writeText(copyText.value);

      copyBtn.innerText = 'Copiado!';
      copyBtn.classList.add('copied');

      setTimeout(() => {
        copyBtn.innerText = 'Copiar';
        copyBtn.classList.remove('copied');
      }, 2500);
    }

    function salvarHistorico(shortUrl) {
      let historico = JSON.parse(localStorage.getItem('link_history') || '[]');
      if (!historico.includes(shortUrl)) {
        historico.unshift(shortUrl);
        if (historico.length > 3) historico.pop(); // Mantem os ultimos 3
        localStorage.setItem('link_history', JSON.stringify(historico));
      }
      carregarHistorico();
    }

    function carregarHistorico() {
      let historico = JSON.parse(localStorage.getItem('link_history') || '[]');
      const historySection = document.getElementById('historySection');
      const historyList = document.getElementById('historyList');

      if (historico.length === 0) {
        historySection.style.display = 'none';
        return;
      }

      historySection.style.display = 'block';
      historyList.innerHTML = historico.map(link => `
        <div class="history-item">
          <a href="${link}" target="_blank">${link}</a>
          <span style="font-size: 11px; color: var(--text-muted);">Pronto</span>
        </div>
      `).join('');
    }
  </script>

</body>
</html>
