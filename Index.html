<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Encurtador de Links</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, sans-serif; }
    body { background: #0f172a; color: #fff; display: flex; align-items: center; justify-content: center; min-height: 100vh; padding: 20px; }
    .card { background: #1e293b; padding: 30px; border-radius: 16px; width: 100%; max-width: 400px; text-align: center; box-shadow: 0 10px 25px rgba(0,0,0,0.4); }
    h1 { color: #38bdf8; font-size: 22px; margin-bottom: 8px; }
    p.sub { font-size: 13px; color: #94a3b8; margin-bottom: 20px; }
    input { width: 100%; padding: 12px; margin-bottom: 10px; border-radius: 8px; border: 1px solid #334155; background: #0f172a; color: #fff; font-size: 14px; outline: none; }
    input:focus { border-color: #38bdf8; }
    button { width: 100%; padding: 12px; background: #0284c7; color: white; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; font-size: 15px; }
    .result { margin-top: 20px; padding-top: 15px; border-top: 1px solid #334155; display: none; }
    .copy-group { display: flex; gap: 6px; }
    .copy-group input { font-weight: bold; color: #38bdf8; }
    .copy-group button { width: auto; background: #334155; padding: 0 14px; }
    #qrcode { display: flex; justify-content: center; margin: 15px auto 0; background: #fff; padding: 10px; border-radius: 8px; width: fit-content; }
  </style>
</head>
<body>

  <div class="card">
    <h1>Encurtador de Links</h1>
    <p class="sub">Links diretos e personalizados.</p>

    <input type="url" id="url" placeholder="https://sua-url-longa.com" required />
    <button onclick="encurtar()">Encurtar Agora</button>

    <div id="result" class="result">
      <p style="font-size: 12px; color: #94a3b8; text-align: left; margin-bottom: 4px;">Seu link gerado:</p>
      <div class="copy-group">
        <input type="text" id="shortUrl" readonly />
        <button onclick="copiar()">Copiar</button>
      </div>
      <div id="qrcode"></div>
    </div>
  </div>

  <script>
    async function encurtar() {
      const url = document.getElementById('url').value.trim();

      if (!url) return alert('Insira uma URL valida!');

      try {
        // Faz a requisição direto para o serviço de encurtamento
        const res = await fetch(`https://is.gd/create.php?format=json&url=${encodeURIComponent(url)}`);
        const data = await res.json();

        if (data.errormessage) {
          return alert('Erro: ' + data.errormessage);
        }

        const shortUrl = data.shorturl;
        document.getElementById('shortUrl').value = shortUrl;
        document.getElementById('result').style.display = 'block';

        const qrcodeDiv = document.getElementById('qrcode');
        qrcodeDiv.innerHTML = '';
        new QRCode(qrcodeDiv, { text: shortUrl, width: 110, height: 110 });

      } catch (err) {
        alert('Erro ao conectar. Tente novamente.');
      }
    }

    function copiar() {
      const copyText = document.getElementById('shortUrl');
      copyText.select();
      navigator.clipboard.writeText(copyText.value);
      alert('Link copiado!');
    }
  </script>
</body>
</html>
